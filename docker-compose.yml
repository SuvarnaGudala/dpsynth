version: '3.8'

services:
  dpsynth:
    build:
      context: .
      dockerfile: Dockerfile
    image: dpsynth:latest
    container_name: dpsynth-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - DB_PATH=/app/data/dpsynth.db
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_DPSynthSandboxKey}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - APP_SECRET=${APP_SECRET:-dpsynth_secret_hmac_salt_2026}
      - COMPANY_GSTIN=${COMPANY_GSTIN:-36AABCD9876E1Z2}
    volumes:
      - dpsynth_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dpsynth_data:
    driver: local
